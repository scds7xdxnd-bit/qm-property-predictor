name: tests

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is deliberately excluded: RDKit 2026.03.6 raises
        # "No to_python converter found for std::basic_string_view" on
        # `import AllChem` there. A Boost binding mismatch, not something
        # the code can work around.
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # PySCF is not needed: no test imports qmprop.qm, and building
          # it would dominate CI time. Torch comes from the CPU index --
          # the default wheel pulls ~2 GB of CUDA that never runs here.
          pip install rdkit numpy pandas scikit-learn xgboost pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Test
        # Network-marked tests hit PubChem and ChEMBL. They skip cleanly
        # when offline, but a red build caused by someone else's rate
        # limit tells us nothing, so they are excluded here and left for
        # local runs.
        run: pytest -q -m "not network"

      - name: Check the QM module at least imports
        # pyscf is absent above, so qm_descriptors must degrade to
        # ok=False rather than raising -- the contract the batch runner
        # depends on to survive molecule 137 of 200.
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, 'src')
          from qmprop.qm import qm_descriptors
          r = qm_descriptors("CCO")
          assert r.ok is False and "pyscf" in r.reason, r
          print("degrades cleanly without pyscf:", r.reason)
          PY
