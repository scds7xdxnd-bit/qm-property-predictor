# conda env create -f environment.yml && conda activate qmprop
name: qmprop
channels:
  - conda-forge
dependencies:
  - python=3.11
  - rdkit=2024.03.*        # cheminformatics: SMILES, descriptors, fingerprints, scaffolds
  - pyscf=2.6.*            # quantum chemistry (the free stand-in for Gaussian)
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - xgboost
  - matplotlib
  - pyyaml
  - tqdm
  - joblib
  - pytest
  - jupyterlab
  - pytorch>=2.2         # Ch 4 stretch goal only (scripts/08_gnn.py)
  - umap-learn           # Ch 2 chemical-space plot; t-SNE is the fallback
  - pip
  - pip:
      - gradio>=6.0
      - anthropic>=0.40  # Ch 7, optional -- see explain.render_llm
