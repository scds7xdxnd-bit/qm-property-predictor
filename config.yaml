# Single source of truth for the pipeline. Every script reads this.

dataset:
  name: esol
  # Tried in order -- the old DeepChem S3 bucket now 404s, so mirrors matter.
  urls:
    - https://raw.githubusercontent.com/deepchem/deepchem/master/datasets/delaney-processed.csv
    - https://deepchem.s3.us-west-1.amazonaws.com/datasets/delaney-processed.csv
  smiles_column: smiles
  target_column: "measured log solubility in mols per litre"
  target_name: logS          # aqueous solubility, log10(mol/L)

split:
  method: scaffold           # scaffold | random  — scaffold is the honest one
  frac_train: 0.8
  frac_valid: 0.0
  frac_test: 0.2
  seed: 42

features:
  morgan:
    radius: 2                # ECFP4
    n_bits: 2048
  descriptors:
    # null = all ~210 RDKit descriptors. Constant and NaN columns are dropped.
    names: null

qm:
  # The expensive arm. Runs on a subset; every ablation arm is scored on
  # exactly this subset so the comparison is not confounded.
  subset_size: 200
  max_heavy_atoms: 20        # PySCF cost scales steeply; keep molecules small
  basis: 6-31G*
  xc: b3lyp
  conformer_seed: 0xf00d
  mmff_max_iters: 500
  # RI-J. Measured 5.3x faster (251 s -> 48 s on a 17-heavy-atom
  # molecule) with the gap moving 0.0007 eV and the dipole 0.0001 D.
  # Turn off if you ever need absolute energies rather than descriptors.
  density_fit: true
  # Caps PySCF's working budget. Matters because parallel workers
  # multiply it; 400 MB was where it started to bind on an 8 GB machine.
  max_memory_mb: 400
  # Not taken: dropping the DFT grid to level 2 was a further 1.4x
  # (48 s -> 33 s) and moved nothing on the one molecule tested. One
  # molecule is thin evidence for a grid change, and coarse grids bite
  # hardest on heavy atoms and diffuse density, which that molecule has
  # neither of. Left at PySCF's default until it is worth measuring
  # properly.

models:
  - ridge
  - random_forest
  - xgboost
  - mlp

output_dir: results
